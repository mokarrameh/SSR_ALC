# Experiment 3 (Table 9, ID 3): unsupervised AE (train_only_ae.py) + LATE-SMOTE + classifier.
global:
  num_workers: 1
  data_path: "dataset"
  labeled_dir: "labeled"
  unlabeled_dir: "unlabeled"
  u_train_subdir: "train"
  u_test_subdir: "test"
  u_val_subdir: "val"
  split_csv: "splits/hyperkvasir_5fold_expanded.csv"
  l_batch_size: 32
  u_train_batch_size: 256
  u_val_batch_size: 64
  u_test_batch_size: 64
  device: "auto"
  checkpoints_dir: "checkpoints"
  name: "EXP_3"

train:
  epochs: 100
  ae_lr: 0.0001
  cl_lr: 0.0001
  weight_decay: 1e-5
  patience: 20
  num_folds: 5
  folds: [0, 1, 2, 3, 4]
  aes: ["convAE", "deepConvAE", "deepConvAEV1"]
  # The expanded split already contains the 56 additional Ileum images (in all folds).
  extra_img_dir: null
  extra_img_n: 0
  extra_seed: 42
