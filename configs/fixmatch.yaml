# FixMatch baseline (Tables 14-15, Fig. 10). Same data as SSR-ALC Experiment 4:
# expanded split (65 Ileum images distributed across folds), no extra train-only images.
global:
  num_workers: 1
  seed: 42
  device: "auto"
  checkpoints_dir: "checkpoints"
  name: "FIXMATCH"
  data_path: "dataset"
  labeled_dir: "labeled"
  unlabeled_dir: "unlabeled"
  u_train_subdir: "train"
  u_val_subdir: "val"
  u_test_subdir: "test"
  split_csv: "splits/hyperkvasir_5fold_expanded.csv"
  l_batch_size: 32
  u_train_batch_size: 256
  u_val_batch_size: 64
  u_test_batch_size: 64

train:
  epochs: 100
  cl_lr: 0.0001
  weight_decay: 1e-5
  patience: 20
  folds: [0, 1, 2, 3, 4]
  extra_img_dir: null
  extra_img_n: 0
  extra_seed: 42
