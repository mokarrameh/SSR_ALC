# Cross-fold evaluation of a selected (alpha, beta, gamma) with hpo_train.py (Table 7).
# Expanded split, 1024-d model, 50 epochs. Set search_space to the configuration to evaluate.
global:
  num_workers: 1
  data_path: "dataset"
  labeled_dir: "labeled"
  unlabeled_dir: "unlabeled"
  u_train_subdir: "train"
  u_test_subdir: "test"
  u_val_subdir: "val"
  split_csv: "splits/hyperkvasir_5fold_expanded.csv"
  l_batch_size: 32
  u_train_batch_size: 256
  u_val_batch_size: 64
  u_test_batch_size: 64
  device: "auto"
  checkpoints_dir: "checkpoints"
  name: "hpo_crossfold"

train:
  enabled: true
  epochs: 50
  ae_lr: 0.0001
  cl_lr: 0.0001
  weight_decay: 1e-5
  patience: 20
  trials: 30
  metric: "val_f1"
  folds: [0, 1, 2, 3, 4]
  aes: ["deepConvAE"]
  seed: 42
  extra_img_dir: "extra_ileum"
  extra_img_n: 0
  extra_seed: 42
  search_space:
    alpha: [10]
    beta: [10]
    gamma: [1]
